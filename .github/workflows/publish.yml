name: Publish Package to npmjs
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Mark package as deprecated
        run: npm deprecate write-aac-metadata "$DEPRECATION_MESSAGE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DEPRECATION_MESSAGE: "This package is no longer maintained. Use node-taglib-sharp directly: https://www.npmjs.com/package/node-taglib-sharp"
